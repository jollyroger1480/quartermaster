# HFP call audio is BlueALSA, not PipeWire.
# No A2DP roles: the phone must not use this PC as a media speaker.
# Copy to ~/.config/wireplumber/wireplumber.conf.d/51-bluez-hfp-cvsd.conf
# then: systemctl --user restart wireplumber

monitor.bluez.properties = {
  bluez5.roles = [ ]
  bluez5.hfphsp-backend = none
}
