# Call audio only. A2DP sink made the PC a Bluetooth speaker, so the phone
# pushed notification sounds out the PC speakers. Drop this file in with:
#   sudo mkdir -p /etc/systemd/system/bluealsa.service.d
#   sudo cp systemd/bluealsa-hfp-only.conf /etc/systemd/system/bluealsa.service.d/hfp-only.conf
#   sudo systemctl daemon-reload && sudo systemctl restart bluealsa
[Service]
ExecStart=
ExecStart=/usr/bin/bluealsad -S -p hfp-hf --all-codecs
